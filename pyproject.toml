[project]
name = "r6sss-discord"
version = "2.7.0"
description = "R6SSS Discord Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "py-cord>=2.8.1",
    "pycord-i18n>=1.2.1",
    "pymongo>=4.18.1",
    "python-box>=7.4.1",
    "python-dotenv>=1.2.3",
    "r6sss>=0.1.0",
    "six>=1.17.0",
    "tzdata>=2026.4",
    "uuid-utils>=1.0.0",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
r6sss = { git = "https://github.com/Milkeyyy/R6SSS_Python" }

[tool.ruff]
line-length = 140

[tool.ruff.format]
docstring-code-format = true
indent-style = "tab"

[tool.ruff.lint]
select = ["ALL"]
# 無視するルール
ignore = [
    "BLE001", # キャッチする例外が明示されていない
    "COM812", # 末尾にカンマがない
    "FIX002", # TODO がある
    "ERA001", # コメントアウトされたコード
    "D1",    # docstring が存在しない
    "D203",  # docstring の前に空白行がない
    "D206", # docstring にタブによるインデントが使用されている
    "D213",  # docstring の最初の行が空白行ではない
    "D400", # docstring の最初の行の末尾が句読点で終わっていない
    "D415", # 同上 (クエスチョンマークなども含む)
    "INP001", # __init__.py ファイルが欠けているパッケージあり
    "RUF001", # あいまいな Unicode 文字の文字列
    "RUF003", # あいまいな Unicode 文字のコメント
    "SIM105", # try-except-pass ブロックを contextlib.suppress コンテキストマネージャーに置き換え
    "TD001", # invalid todo tag
    "TD002", # missing todo author
    "TD003", # missing todo link
    "W191", # インデントがタブになっている
    "E402", # モジュールレベルインポートがファイルの先頭にない（循環参照回避のため）
]
unfixable = [
    "F401", # unused import
    "F841", # unused variable
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
# テストコードでは以下のルールを無視する
"tests/*" = [
    "ANN",     # 型注釈
    "ARG",     # 未使用の引数 (フェイク実装)
    "FBT",     # bool 型の位置引数 (フェイク実装)
    "PLR2004", # マジックナンバーの比較
    "S101",    # assert の使用
    "SLF001",  # プライベートメンバーへのアクセス
]

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 30

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
